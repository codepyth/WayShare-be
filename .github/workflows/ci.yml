name: CI

on:
  push:
    branches: [main, wdev]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
      DJANGO_DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: No model changes without a migration
        run: python manage.py makemigrations --check --dry-run

      - name: openapi.json is up to date
        run: |
          python manage.py spectacular --format openapi-json --file /tmp/openapi.json
          diff openapi.json /tmp/openapi.json
